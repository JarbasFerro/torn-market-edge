<!doctype html>
<html><body>
<div id="mainContainer">
  <div id="bazaarRoot" class="bazaar-main-wrap">
    <h4 class="title">Add items to your Bazaar</h4>
    <div class="info">You are adding 0 items across 0 categories</div>
    <ul class="items-cont">
      <li class="clearfix">
        <div class="image-wrap"><img src="/images/items/206/large.png" alt="Xanax"></div>
        <div class="title-wrap"><span class="name">Xanax</span> <span class="qty">x25</span></div>
        <div class="amount-main-wrap">
          <div class="amount"><input class="clear-all" type="text" placeholder="Qty"></div>
          <div class="price"><input class="input-money" type="text" placeholder="Price"></div>
        </div>
      </li>
      <li class="clearfix">
        <div class="image-wrap"><img src="/images/items/258/large.png" alt="Jaguar Plushie"></div>
        <div class="title-wrap"><span class="name">Jaguar Plushie</span> <span class="qty">x7</span></div>
        <div class="amount-main-wrap">
          <div class="amount"><input class="clear-all" type="text" placeholder="Qty" max="3"></div>
          <div class="price"><input class="input-money" type="text" placeholder="Price"></div>
        </div>
      </li>
      <li class="clearfix disabled">
        <div class="image-wrap"><img src="/images/items/1/large.png" alt="Hammer"></div>
        <div class="title-wrap"><span class="name">Hammer</span> <span class="qty">x1</span></div>
        <div class="amount-main-wrap">
          <div class="amount"><input class="clear-all" type="text" placeholder="Qty"></div>
          <div class="price"><input class="input-money" type="text" placeholder="Price"></div>
        </div>
      </li>
    </ul>
    <button type="button">ADD TO BAZAAR</button>
  </div>
</div>
</body></html>
