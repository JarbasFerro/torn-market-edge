name: Bug report
description: Report incorrect behavior, pricing, DOM detection or UI rendering
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Torn Market Edge. Never include your Torn API key.
  - type: input
    id: version
    attributes:
      label: Market Edge version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Torn surface
      options:
        - Inventory
        - Your Bazaar
        - Another player's Bazaar
        - Item Market
        - Auction House
        - Travel shop
        - Settings
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser and userscript manager
      placeholder: "iPhone / Safari / userscript manager version, or Windows / Chrome / Tampermonkey"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include category/item names where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / sanitized diagnostics
      description: Remove private data and never include an API key.
