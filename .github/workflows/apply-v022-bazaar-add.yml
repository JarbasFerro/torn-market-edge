name: Apply v0.2.2 Bazaar add support

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v022-bazaar-add.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v0.2.2 patch
        run: python3 scripts/apply_v022_bazaar_add.py

      - name: Build userscript
        run: cat src/parts/*.part.js > torn-market-edge.user.js

      - name: Validate JavaScript
        run: node --check torn-market-edge.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Remove one-time patch files
        run: |
          rm scripts/apply_v022_bazaar_add.py
          rm .github/workflows/apply-v022-bazaar-add.yml

      - name: Commit v0.2.2 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: support Bazaar add-form price suggestions v0.2.2"
          git push
