name: Finalize v0.2.1 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v021-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          part = Path('src/parts/00.part.js')
          text = part.read_text()
          text = text.replace('// @version      0.2.0', '// @version      0.2.1', 1)
          text = text.replace('// v0.2.0: SPA-safe incremental scanning, concurrent API loading, persistent\n// stale-while-revalidate snapshots, batched item metadata, viewport priority\n// and compact surface-specific inline intelligence.', '// v0.2.1: release hardening for SPA reconciliation, queued-request cancellation,\n// surface-safe price parsing, Item Market source consistency and regression QA.', 1)
          text = text.replace('version: "0.2.0"', 'version: "0.2.1"', 1)
          part.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '## [Unreleased]\n\n### Fixed\n'
          replacement = '## [Unreleased]\n\n## [0.2.1] - 2026-09-08\n\n### Fixed\n'
          if marker in text:
              text = text.replace(marker, replacement, 1)
          changelog.write_text(text)
          PY

      - name: Build and validate userscript
        run: |
          cat src/parts/*.part.js > torn-market-edge.user.js
          node --check torn-market-edge.user.js
          node --test tests/*.test.js
          grep -q '^// @version      0.2.1$' torn-market-edge.user.js

      - name: Remove one-time workflow and push release
        run: |
          rm .github/workflows/release-v021-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parts/00.part.js torn-market-edge.user.js CHANGELOG.md .github/workflows/release-v021-once.yml
          git commit -m "release: publish Market Edge v0.2.1"
          git push
