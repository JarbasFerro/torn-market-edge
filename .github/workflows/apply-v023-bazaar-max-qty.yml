name: Apply v0.2.3 Bazaar max quantity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v023-bazaar-max-qty.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v0.2.3 patch
        run: python3 scripts/apply_v023_bazaar_max_qty.py

      - name: Relax brittle comment guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/economics.test.js')
          text = path.read_text(encoding='utf-8')
          old = '  assert.ok(source.includes("Market Edge never submits a Bazaar form automatically"));\n'
          new = '  assert.ok(source.includes("never submits a Bazaar form automatically"));\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old guard, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Build userscript
        run: cat src/parts/*.part.js > torn-market-edge.user.js

      - name: Validate JavaScript
        run: node --check torn-market-edge.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Remove one-time patch files
        run: |
          rm scripts/apply_v023_bazaar_max_qty.py
          rm .github/workflows/apply-v023-bazaar-max-qty.yml

      - name: Commit v0.2.3 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: fill Bazaar max quantity with price suggestion v0.2.3"
          git push
