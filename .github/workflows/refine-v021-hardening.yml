name: Refine v0.2.1 hardening

on:
  push:
    branches:
      - v0.2.1-hardening-work2
    paths:
      - ".github/workflows/refine-v021-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply conservative refinements
        run: python3 scripts/refine_v021_hardening.py

      - name: Build userscript
        run: cat src/parts/*.part.js > torn-market-edge.user.js

      - name: Validate JavaScript syntax
        run: node --check torn-market-edge.user.js

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Commit refined candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parts/06.part.js src/parts/07.part.js torn-market-edge.user.js tests/economics.test.js
          if git diff --cached --quiet; then
            echo "No refinement changes to commit."
            exit 0
          fi
          git commit -m "fix: tighten v0.2.1 DOM reconciliation"
          git push
