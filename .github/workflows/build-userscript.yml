name: Build userscript

on:
  push:
    branches:
      - main
    paths:
      - "src/parts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build userscript
        run: cat src/parts/*.part.js > torn-market-edge.user.js

      - name: Validate JavaScript
        run: node --check torn-market-edge.user.js

      - name: Commit generated userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-market-edge.user.js
          if git diff --cached --quiet; then
            echo "Generated userscript is already up to date."
            exit 0
          fi
          git commit -m "build: generate userscript"
          git push
